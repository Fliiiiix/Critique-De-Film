<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Critique de films</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sprockets" id="sprocketsTop"></div>
<header>
  <div class="container" style="padding:0;">
    <div class="eyebrow">Grille de lecture personnelle</div>
    <div class="title-row">
      <h1>Critique de films</h1>
      <div class="version-tag">v<b>1.3</b></div>
    </div>
    <div class="user-bar" id="userBar" style="display:none;">
      <span id="userEmail"></span>
      <button class="btn secondary" id="logoutBtn">Déconnexion</button>
    </div>
  </div>
</header>

<!-- Écran de connexion (lien magique par email) -->
<div class="container" id="authContainer" style="display:none;">
  <div class="auth-card">
    <h2>Connexion</h2>
    <p class="auth-intro">Entre ton email : tu recevras un lien de connexion, sans mot de passe.</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="authEmail" placeholder="toi@example.com" autocomplete="email">
    </div>
    <button class="btn" id="authSendBtn">Envoyer le lien magique</button>
    <div class="auth-status" id="authStatus"></div>
  </div>
</div>

<div class="container" id="appContainer" style="display:none;">
  <div class="toolbar">
    <input type="text" id="search" placeholder="Rechercher un film…">
    <select id="sortBy">
      <option value="note-desc">Note ↓</option>
      <option value="note-asc">Note ↑</option>
      <option value="title-asc">Titre A–Z</option>
      <option value="fav-first">Favoris d'abord</option>
      <option value="recent">Ajout récent</option>
    </select>
    <button class="btn secondary" id="exportBtn">Exporter (JSON)</button>
    <button class="btn secondary" id="importBtn">Importer (JSON)</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none;">
    <button class="btn" id="openAddBtn">+ Ajouter un film</button>
  </div>
  <div class="count-line" id="countLine"></div>
  <div id="filmList"></div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Nouveau film</h2>
      <button class="close-x" id="closeModal">✕</button>
    </div>

    <div class="field">
      <label>Titre du film</label>
      <input type="text" id="titleInput" placeholder="Ex. Paprika">
    </div>

    <div id="criteriaWrap"></div>

    <div class="modal-footer">
      <div class="live-score">Note calculée · <b id="liveScore">—</b> / 5</div>
      <div class="right">
        <button class="btn danger" id="deleteBtn" style="display:none;">Supprimer</button>
        <button class="btn secondary" id="cancelBtn">Annuler</button>
        <button class="btn" id="saveBtn">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseConfig.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
